<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Astra Space Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --grid-line: rgba(120, 170, 220, 0.09);
      --line: rgba(237, 237, 240, 0.10);
      --line-strong: rgba(237, 237, 240, 0.20);
      --text: #edecf0;
      --text-dim: #9ba0b8;
      --text-faint: #666b82;
      --gold: #f2b955;
      --teal: #4fd1ae;
      --violet: #9a8cf5;
      --coral: #f0876a;
      --paper: #efe8d8;
      --ink: #22201a;
      --ink-dim: #5b5748;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    h1,
    h2,
    .display {
      font-family: 'Space Grotesk', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, black 40%, transparent 90%);
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 14, 26, 0.9);
      backdrop-filter: blur(8px);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: 17px;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: conic-gradient(from 200deg, var(--gold), var(--coral) 40%, var(--violet) 75%, var(--gold));
      flex-shrink: 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 28px;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    nav a {
      color: var(--text-dim);
      text-decoration: none;
    }

    nav a.active {
      color: var(--text);
      border-bottom: 1px solid var(--gold);
      padding-bottom: 4px;
    }

    .intro {
      padding: 56px 0 32px;
    }

    .eyebrow-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .orbit-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
    }

    .kicker {
      color: var(--text-dim);
      font-size: 14px;
    }

    .intro h1 {
      font-size: 38px;
      font-weight: 500;
      margin: 0 0 12px;
      max-width: 16ch;
      line-height: 1.15;
    }

    .intro p {
      color: var(--text-dim);
      max-width: 56ch;
      font-size: 16px;
      margin: 0;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 0 50px;
    }

    .filter {
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--text-dim);
      font-size: 13.5px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .filter.is-active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .filter .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* pegboard of patches */
    .board {
      display: flex;
      flex-wrap: wrap;
      gap: 36px 28px;
      justify-content: center;
      padding-bottom: 70px;
    }

    .patch-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 170px;
      cursor: pointer;
    }

    .board .patch-wrap:nth-child(even) {
      margin-top: 34px;
    }

    .pin {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      margin-bottom: 6px;
      box-shadow: 0 6px 6px rgba(0, 0, 0, 0.4);
    }

    .patch {
      transition: transform .25s ease, filter .25s ease;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.4));
    }

    .patch-wrap:hover .patch {
      transform: rotate(-3deg) translateY(-4px);
    }

    .patch-name {
      margin-top: 12px;
      font-size: 13.5px;
      font-weight: 500;
      text-align: center;
    }

    .patch-status {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-faint);
      text-align: center;
    }

    /* dossier */
    .dossier-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 6, 14, 0.78);
      backdrop-filter: blur(3px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease;
      perspective: 1600px;
    }

    .dossier-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .dossier {
      width: min(620px, 94vw);
      max-height: 86vh;
      overflow-y: auto;
      background: #c3d1ff;
      color: #210734;
      border-radius: 3px;
      transform-origin: top center;
      transform: rotateX(-88deg) translateY(-20px);
      opacity: 0;
      transition: transform .5s cubic-bezier(.2, .85, .25, 1), opacity .25s ease;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55);
      padding: 30px 34px 40px;
    }

    .dossier-backdrop.is-open .dossier {
      transform: rotateX(0deg) translateY(0);
      opacity: 1;
    }

    .d-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(34, 32, 26, 0.18);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .d-code {
      font-size: 11.5px;
      letter-spacing: 1.5px;
      color: var(--ink-dim);
    }

    .d-title {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 500;
      margin: 6px 0 0;
    }

    .d-close {
      background: none;
      border: 1px solid rgba(34, 32, 26, 0.3);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      color: var(--ink-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .d-close svg {
      width: 13px;
      height: 13px;
    }

    .stamp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid;
      border-radius: 3px;
      padding: 3px 10px;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 500;
      margin-bottom: 18px;
      transform: rotate(-2deg);
    }

    .stamp.completed {
      color: #1f6b52;
      border-color: #1f6b52;
    }

    .stamp.ongoing {
      color: #a1461f;
      border-color: #a1461f;
    }

    .stamp.prototype {
      color: #4a3f8f;
      border-color: #4a3f8f;
    }

    .d-body p {
      font-size: 15px;
      color: var(--ink);
      margin: 0 0 12px;
      max-width: 56ch;
    }

    .d-label {
      font-size: 11.5px;
      letter-spacing: 1px;
      color: var(--ink-dim);
      margin: 24px 0 10px;
    }

    .checklist {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    .checklist li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }

    .checklist .box {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--ink-dim);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .checklist li.done .box {
      background: #1f6b52;
      border-color: #1f6b52;
      color: var(--paper);
    }

    .checklist li.current .box {
      border-color: #a1461f;
    }

    .checklist li.current {
      font-weight: 500;
    }

    .checklist li:not(.done):not(.current) {
      color: var(--ink-dim);
    }

    .crew {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .crew-member {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
    }

    .crew-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 500;
    }

    .polaroids {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .polaroid {
      background: #fff;
      padding: 8px 8px 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      width: 120px;
    }

    .polaroid img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      display: block;
    }

    .polaroid:nth-child(1) {
      transform: rotate(-4deg);
    }

    .polaroid:nth-child(2) {
      transform: rotate(3deg);
    }

    .polaroid:nth-child(3) {
      transform: rotate(-2deg);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 32px 0 48px;
      margin-top: 20px;
    }

    footer p {
      color: var(--text-faint);
      font-size: 13.5px;
      margin: 0;
    }

    @media (max-width:640px) {
      .intro h1 {
        font-size: 28px;
      }

      nav ul {
        gap: 16px;
        font-size: 13px;
      }

      .board {
        gap: 28px 18px;
      }

      .patch-wrap {
        width: 140px;
      }

      .board .patch-wrap:nth-child(even) {
        margin-top: 18px;
      }
    }
  </style>
  <link rel="stylesheet" href="../static/css/projects-cards.css">
  <link rel="stylesheet" href="../static/css/projects-sections.css">
</head>

<body>
  <video class="projects-galaxy" autoplay muted playsinline loop preload="metadata" aria-hidden="true">
    <source src="../static/assets/galaxy_small.mp4" type="video/mp4">
  </video>
  <div class="projects-veil" aria-hidden="true"></div>

  <header>
    <div class="wrap nav">
      <div class="brand"><span class="brand-mark"></span>Astra Space Club</div>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="projects.html" class="active">Projects</a></li>
          <li><button class="article-button" type="button">Articles</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <div class="eyebrow-row"><span class="orbit-dot"></span><span class="kicker">PROJECT LOG / ACTIVE</span></div>
      <h1>What we've built</h1>
      <p>Experiments, instruments, and tools made by the Antariksh crew. Explore the current build archive below.</p>
    </section>

    <div class="filters">
      <button class="filter is-active" data-filter="all">All missions</button>
      <button class="filter" data-filter="completed"><span class="dot"
          style="background:var(--teal)"></span>Completed</button>
      <button class="filter" data-filter="ongoing"><span class="dot"
          style="background:var(--coral)"></span>Ongoing</button>
      <button class="filter" data-filter="prototype"><span class="dot"
          style="background:var(--violet)"></span>Prototype</button>
    </div>

    <div class="board" id="board"></div>
  </main>

  <footer>
    <div class="wrap">
      <p>Astra Space Club · Meets every Friday, Room 214 · astraclub@college.edu</p>
    </div>
  </footer>

  <div class="dossier-backdrop" id="dBackdrop">
    <div class="dossier" id="dossier">
      <div class="d-top">
        <div>
          <div class="d-code mono" id="dCode"></div>
          <h2 class="d-title" id="dTitle"></h2>
        </div>
        <button class="d-close" id="dClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg></button>
      </div>
      <div id="dStamp"></div>
      <div class="d-body" id="dBody"></div>
      <div class="d-label mono">BUILD LOG</div>
      <ul class="checklist" id="dChecklist"></ul>
      <div class="d-label mono">CREW</div>
      <div class="crew" id="dCrew"></div>
      <div id="dPolaroids"></div>
    </div>
  </div>

  <script>
    const STAGES = ['Design', 'Build', 'Test', 'Results'];
    const STATUS_LABEL = { completed: 'Completed', ongoing: 'Ongoing', prototype: 'Prototype' };
    const STATUS_COLOR = { completed: 'var(--teal)', ongoing: 'var(--coral)', prototype: 'var(--violet)' };

    const ICONS = {
      satellite: `<rect x="-9" y="-7" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="-9" y1="-2" x2="-24" y2="-10" stroke="currentColor" stroke-width="2"/>
                <line x1="-9" y1="4" x2="-24" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="9" y1="-2" x2="24" y2="-10" stroke="currentColor" stroke-width="2"/>
                <line x1="9" y1="4" x2="24" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="0" y1="-7" x2="0" y2="-18" stroke="currentColor" stroke-width="2"/>
                <circle cx="0" cy="-20" r="2" fill="currentColor"/>`,
      dish: `<path d="M-18,6 A18,18 0 0,1 18,6" fill="none" stroke="currentColor" stroke-width="2"/>
           <line x1="0" y1="6" x2="0" y2="20" stroke="currentColor" stroke-width="2"/>
           <line x1="0" y1="6" x2="10" y2="-10" stroke="currentColor" stroke-width="2"/>
           <circle cx="10" cy="-10" r="2" fill="currentColor"/>`,
      signal: `<path d="M-16,10 A22,22 0 0,1 16,10" fill="none" stroke="currentColor" stroke-width="2"/>
             <path d="M-9,10 A13,13 0 0,1 9,10" fill="none" stroke="currentColor" stroke-width="2"/>
             <circle cx="0" cy="10" r="2.5" fill="currentColor"/>`,
      clipboard: `<rect x="-12" y="-16" width="24" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect x="-5" y="-19" width="10" height="6" rx="1" fill="currentColor"/>
                <line x1="-7" y1="-4" x2="7" y2="-4" stroke="currentColor" stroke-width="1.6"/>
                <line x1="-7" y1="2" x2="7" y2="2" stroke="currentColor" stroke-width="1.6"/>
                <line x1="-7" y1="8" x2="3" y2="8" stroke="currentColor" stroke-width="1.6"/>`
    };

    const PROJECTS = [
      {
        id: 'asrt', code: 'HW · 01', status: 'completed', icon: 'satellite', title: 'ASRT assembly',
        body: ["The ASRT (automated sky/rocket tracker) is a dual-axis rotator built to keep a payload or telescope pointed at a moving target, covering the frame, motor driver stage, and control loop.", "Now on its second revision after the first prototype showed backlash in the elevation axis, fixed with a redesigned gear coupling."],
        stage: 3, team: ['AK', 'RS', 'MP', 'TN'],
        images: ['https://picsum.photos/seed/asrt1/300/220', 'https://picsum.photos/seed/asrt2/300/220', 'https://picsum.photos/seed/asrt3/300/220']
      },
      {
        id: 'horn', code: 'HW · 02', status: 'completed', icon: 'dish', title: 'Horn antenna',
        body: ["A scratch-built horn antenna tuned for receiving NOAA weather satellite signals in the 137 MHz band, made from sheet aluminium with a quarter-wave probe feed.", "First successful decode was a clean image from a NOAA-19 pass."],
        stage: 3, team: ['SD', 'PK'],
        images: ['https://picsum.photos/seed/horn1/300/220', 'https://picsum.photos/seed/horn2/300/220']
      },
      {
        id: 'imgproc', code: 'SW · 01', status: 'ongoing', icon: 'signal', title: 'Image processing pipeline',
        body: ["A pipeline that takes raw frames from star party sessions and produces stacked, noise-reduced images automatically, so members don't need a full editing suite to see clean results.", "Currently working on automatic star alignment before stacking, the main bottleneck right now."],
        stage: 1, team: ['NV', 'AK', 'JR'], images: []
      },
      {
        id: 'sched', code: 'SW · 02', status: 'prototype', icon: 'clipboard', title: 'Mission scheduling tool',
        body: ["A small internal tool to book club telescopes for personal use and track who has completed the handling workshop. Still in early design, no working build yet."],
        stage: 0, team: ['MP', 'TN'], images: []
      }
    ];

    const board = document.getElementById('board');
    function render(list) {
      board.innerHTML = list.map((p, i) => `
      <article class="project-card project-card-${i + 1}" data-id="${p.id}">
        <div class="project-image project-image-${p.id}"><span>${p.code}</span></div>
        <div class="project-copy"><p class="project-status">${STATUS_LABEL[p.status]} / ${p.code}</p><h2>${p.title}</h2><p>${p.body[0]}</p><button class="project-open" type="button">OPEN BUILD LOG <b>↗</b></button></div>
        <aside class="project-actions"><div><span>STATUS AND<br>RESOURCES</span><b>${STATUS_LABEL[p.status].toUpperCase()}</b><small>${p.stage + 1} / ${STAGES.length} BUILD STAGES</small></div><button class="project-article" type="button">VIEW ARTICLE</button></aside>
        <div class="project-crew"><span>CREW</span>${p.team.map(member => `<b>${member}</b>`).join('')}</div>
      </article>
    `).join('');
      board.querySelectorAll('.project-card').forEach(el => {
        el.addEventListener('click', () => openDossier(el.dataset.id));
      });
      board.querySelectorAll('.project-article').forEach(button => button.addEventListener('click', event => event.stopPropagation()));
    }
    render(PROJECTS);


    document.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        const f = btn.dataset.filter;
        render(f === 'all' ? PROJECTS : PROJECTS.filter(p => p.status === f));
      });
    });

    const dBackdrop = document.getElementById('dBackdrop');
    const dCode = document.getElementById('dCode');
    const dTitle = document.getElementById('dTitle');
    const dStamp = document.getElementById('dStamp');
    const dBody = document.getElementById('dBody');
    const dChecklist = document.getElementById('dChecklist');
    const dCrew = document.getElementById('dCrew');
    const dPolaroids = document.getElementById('dPolaroids');

    function openDossier(id) {
      const p = PROJECTS.find(x => x.id === id);
      if (!p) return;

      dCode.textContent = p.code;
      dTitle.textContent = p.title;
      dStamp.innerHTML = `<span class="stamp ${p.status}">${STATUS_LABEL[p.status].toUpperCase()}</span>`;
      dBody.innerHTML = p.body.map(t => `<p>${t}</p>`).join('');

      dChecklist.innerHTML = STAGES.map((s, i) => {
        const cls = i < p.stage ? 'done' : (i === p.stage ? 'current' : '');
        const mark = i < p.stage ? '✓' : '';
        return `<li class="${cls}"><span class="box">${mark}</span>${s}</li>`;
      }).join('');

      dCrew.innerHTML = p.team.map(t => `<div class="crew-member"><span class="crew-avatar">${t}</span>${t}</div>`).join('');

      dPolaroids.innerHTML = p.images.length
        ? `<div class="d-label mono">FROM THE BUILD</div><div class="polaroids">${p.images.map(src => `<div class="polaroid"><img src="${src}" alt="Photo from ${p.title}" loading="lazy"></div>`).join('')}</div>`
        : '';

      dBackdrop.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeDossier() {
      dBackdrop.classList.remove('is-open');
      document.body.style.overflow = '';
    }
    document.getElementById('dClose').addEventListener('click', closeDossier);
    dBackdrop.addEventListener('click', e => { if (e.target === dBackdrop) closeDossier(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDossier(); });
  </script>

</body>

</html>
